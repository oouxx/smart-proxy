# ============================================================
# vernesong/mihomo 代理配置 (用于 smart 组件采集真实流量 + 训练模型)
#
# 用法:
#   1. 用编译好的 vernesong/mihomo 二进制运行本配置
#   2. 把系统/应用代理指向 mixed-port (默认 7890)
#   3. 真实流量经过 SMART 组 -> smart 组件自动采集训练样本
#   4. 采集数据写入 <home>/smart_weight_data.csv
#   5. 用 scripts/train_smart.py 训练模型 -> 替换 <home>/Model.bin
#
# 注意: 本文件引用 config/mihomo.yaml (你的节点池, 2702 个节点)
# ============================================================

# 入站端口 (HTTP + SOCKS5 混合)
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

# ---------- smart 组件设置 ----------
# 是否自动从 lgbm-url 下载/更新模型
lgbm-auto-update: false
# 自动更新间隔 (小时)
lgbm-update-interval: 72
# 模型下载地址 (留空则用默认)
lgbm-url: "https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model.bin"
profile:
  # 训练数据 CSV 大小上限 (MB)，达到后停止采集
  smart-collector-size: 100

# ---------- 节点源 (你的节点池) ----------
proxy-providers:
  mynodes:
    type: file
    path: ./mihomo.yaml
    health-check:
      url: https://www.gstatic.com/generate_204
      interval: 300

# ---------- smart 代理组 ----------
proxy-groups:
  - name: "SMART"
    type: smart
    use:
      - mynodes
    # 使用 LightGBM 模型打分
    uselightgbm: true
    # 采集训练数据 (写入 smart_weight_data.csv)
    collectdata: true
    # 采样率 0~1，1.0 表示全部连接都采样
    sample-rate: 1.0
    # 优先同 ASN (可选)
    prefer-asn: false
    # 容差 (可选)
    tolerance: 0

# ---------- 规则: 所有流量走 SMART 组 ----------
rules:
  - MATCH,SMART
