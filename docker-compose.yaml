# mihomo-smart 部署编排
#
# 用法:
#   1. 准备配置: cp config.example.yaml config/config.yaml (按需修改)
#   2. 构建并启动: docker compose up -d --build
#   3. 查看日志: docker compose logs -f
#
# 单服务架构:
#   serve 进程同时提供 HTTP 下载 (端口 8000) 和 cron 定时 collect
#   (collect 的 cron 表达式在 config.yaml 的 collect.schedule 配置)

services:
  serve:
    build: .
    container_name: mihomo-smart
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
    # 默认 CMD 启动 serve (内含 APScheduler 按 collect.schedule 定时跑 collect)
